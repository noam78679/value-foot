name: Mise à jour des cotes
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: maj
  cancel-in-progress: false
jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Récupérer cotes et stats
        run: ./outils/mise-a-jour.sh
      - name: Enregistrer
        run: |
          git config user.name "value-foot-bot"
          git config user.email "value-foot-bot@users.noreply.github.com"
          git add data.json index.html analyse-paris.html
          git diff --cached --quiet || (git commit -m "Cotes du $(TZ=Europe/Paris date '+%d/%m %H:%M')" && git pull --rebase -X theirs && git push)
